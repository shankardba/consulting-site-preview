<body data-root="" data-page="login">
<main class="login-main wrap">
  <section class="login-card card">
    <div class="eyebrow">Client portal</div>
    <h1>Sign in</h1>
    <p class="muted">See where your project stands, read every progress report, and find your project history in one place.</p>
    <form class="form" id="login" novalidate>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="status" id="status" role="alert" hidden></p>
      <button class="btn" type="submit" id="go">Sign in</button>
    </form>
    <p class="muted small">Not a client yet? <a href="start.html">Start a project</a>. Your login arrives once your proposal is accepted.</p>
  </section>
</main>
<script src="js/site.js"></script>
<script>
(async function(){
  const f = document.getElementById("login"), st = document.getElementById("status"), go = document.getElementById("go");
  const say = (msg, bad) => { st.hidden = false; st.textContent = msg; st.style.background = bad ? "var(--bad-soft)" : "var(--warn-soft)"; };
  const PREVIEW = "Preview only: client login runs on the live site, not on this preview copy.";
  try {
    const r = await fetch("/api/session", { cache: "no-store" });
    const me = r.ok ? await r.json() : {};
    if (me.signedIn) { location.replace(me.admin ? "admin.html" : "portal.html"); return; }
  } catch {}
  if (new URLSearchParams(location.search).has("expired")) say("Please sign in again to continue.");
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (!f.email.value || !f.email.validity.valid) { say("Please enter your email.", true); f.email.focus(); return; }
    if (!f.password.value) { say("Please enter your password.", true); f.password.focus(); return; }
    go.disabled = true; go.textContent = "Signing in…"; st.hidden = true;
    try {
      const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: f.email.value, password: f.password.value }) });
      if ([404, 405, 501].includes(res.status)) { say(PREVIEW); return; }
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { say(out.error || "Something went wrong. Please try again.", true); f.password.select(); return; }
      location.replace(out.admin ? "admin.html" : "portal.html");
    } catch { say("Couldn’t reach the server. Check your connection and try again.", true); }
    finally { go.disabled = false; go.textContent = "Sign in"; }
  });
})();
</script>
</body>
</html>
