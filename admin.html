<body data-root="" data-page="admin">
<main id="admin" class="wrap portal admin" aria-busy="true">
  <p class="muted">Loading…</p>
</main>
<p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
<dialog id="new-dialog" class="adm-dialog">
  <form method="dialog" id="new-form" class="form">
    <h2>New project</h2>
    <p class="muted small">For a request that came in by email or phone. Website requests are added automatically.</p>
    <label>Client email<input name="owner" type="email" required autocomplete="off"></label>
    <label>Business<input name="business" autocomplete="off"></label>
    <label>Project title<input name="title" required autocomplete="off"></label>
    <label>Service<input name="service" list="services" autocomplete="off"></label>
    <label>What they asked for<textarea name="summary" rows="3"></textarea></label>
    <label>Request date<input name="proposed" type="date"></label>
    <p class="status" id="new-status" hidden></p>
    <div class="row-btns"><button class="btn" value="create">Add project</button><button class="btn ghost" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>
<datalist id="services">
  <option value="Spreadsheet to App"><option value="Workbook Audit"><option value="AWS Review"><option value="Automation">
  <option value="Knowledge Assistant"><option value="Website"><option value="Learning App"><option value="Advisor retainer">
  <option value="Add-on: Forms"><option value="Add-on: Search basics"><option value="Care plan">
</datalist>
<script src="js/site.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
